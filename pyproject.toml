[project]
name = "biocframe"
dynamic = [
    "version",
]
description = "Flexible dataframe representation to support nested structures."
readme = "README.md"
authors = [
    { name = "Jayaram Kancherla", email = "jayaram.kancherla@gmail.com" },
]
requires-python = ">=3.9"
keywords = [
    "biocpy",
    "bioinformatics",
    "dataframe",
    "bioconductor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "biocutils>=0.3.3",
    "numpy>=1.26.0",
]

[project.license]
file = "LICENSE.txt"

[project.urls]
Homepage = "https://github.com/BiocPy/biocframe"
Documentation = "https://biocpy.github.io/BiocFrame/"
Source = "https://github.com/BiocPy/biocframe"
"Bug Tracker" = "https://github.com/BiocPy/biocframe/issues"

[project.optional-dependencies]
optional = [
    "pandas>=2.0.0",
    "polars>=0.20.0",
]
testing = [
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "setuptools>=68.0.0",
]

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.ruff]
line-length = 120
src = [
    "src",
]
exclude = [
    "tests",
    "docs",
]

[tool.ruff.lint]
extend-ignore = [
    "F821",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "E402",
    "F401",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing"
testpaths = [
    "tests",
]
