[project]
name = "biocframe"
dynamic = ["version"]
description = "Flexible dataframe representation to support nested structures."
readme = "README.md"
authors = [
    { name = "Jayaram Kancherla", email = "jayaram.kancherla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "biocutils>=0.3.3",
    "importlib-metadata>=9.0.0 ; python_full_version < '3.8'",
    "numpy>=2.5.2",
]

[project.optional-dependencies]
optional = [
    "pandas>=3.0.5",
    "polars>=1.44.0",
]
testing = [
    "pandas>=3.0.5",
    "polars>=1.44.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "setuptools>=84.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.ruff]
line-length = 120
src = ["src"]
exclude = ["tests", "docs"]

[tool.ruff.lint]
extend-ignore = ["F821"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "linkify-it-py>=2.1.1",
    "mypy>=2.3.1",
    "myst-nb>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.4",
]
